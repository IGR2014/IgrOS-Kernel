# Host
sonar.host.url=https://sonarcloud.io

# Organization
sonar.organization=igr2014

# Project parameters
sonar.projectKey=IGR2014_IgrOS-Kernel
sonar.projectName=IgrOS-Kernel
sonar.projectVersion=0.1.34

# Sources directory
sonar.sources=.
# Generated and local folders (CMake compiler-id sources, install tree, compiler cache)
sonar.exclusions=tests/**,build/**,install/**,.ccache/**,docs/**

# Rules that conflict with freestanding kernel requirements (see docs in each rule)
sonar.issue.ignore.multicriteria=globals,byte,ellipsis,fnptr,fields
# S5421: kernel state (allocator bitmap, page tables, TSS, VGA cursor...) is mutable by nature;
# all of it already has internal linkage (anonymous namespace / static)
sonar.issue.ignore.multicriteria.globals.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.globals.resourceKey=**/*
# S6022: port I/O and hardware registers are unsigned 8-bit values, not opaque bytes
sonar.issue.ignore.multicriteria.byte.ruleKey=cpp:S6022
sonar.issue.ignore.multicriteria.byte.resourceKey=**/*
# S923: printf-style kernel logging needs C varargs (no heap, no exceptions)
sonar.issue.ignore.multicriteria.ellipsis.ruleKey=cpp:S923
sonar.issue.ignore.multicriteria.ellipsis.resourceKey=klib/kPrint.*
# S5205: IDT/ISR/IRQ tables hold raw handler addresses (std::function needs heap and RTTI)
sonar.issue.ignore.multicriteria.fnptr.ruleKey=cpp:S5205
sonar.issue.ignore.multicriteria.fnptr.resourceKey=**/*
# S1820: multiboot info layout is fixed by the Multiboot specification
sonar.issue.ignore.multicriteria.fields.ruleKey=cpp:S1820
sonar.issue.ignore.multicriteria.fields.resourceKey=multiboot/multiboot.hpp

# Tests directory
sonar.tests=tests

# Sources encoding
sonar.sourceEncoding=UTF-8

