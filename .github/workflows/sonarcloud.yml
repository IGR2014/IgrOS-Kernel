name: 'SonarCloud'

# Triggered on push to any branch, PR to master or manually
# (not workflow_run: it always uses workflow files and code of the default branch)
on:
  push:
    branches: [ '**' ]
    paths-ignore: &docs
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.devcontainer/**'
      - '*.code-workspace'
      - '*.kateproject'
  pull_request:
    branches: [ 'master' ]
    paths-ignore: *docs
  workflow_dispatch:

# A newer push to the same branch/PR cancels the analysis still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    # Environment variables
    env:
      IGROS_KERNEL_DIR_BUILD: "${{ github.workspace }}/build"
      # Runs started by Dependabot (and PRs from forks) get no repository secrets:
      # upload steps are skipped then (secrets can't be tested in step conditions directly)
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install dependencies (configure only: Sonar needs compile commands, not binaries)
    - name: 'Install Dependencies'
      # Stalled apt mirror: phases time out and retry (ci-apt.sh) instead of hanging the job
      timeout-minutes: 15
      shell: bash
      run: |
        bash config/script/ci-apt.sh clang cmake g++-multilib gcovr jq ninja-build

    # Configure both architectures with Clang
    # (one analysis per project/branch: Sonar keeps only the last one, and it
    # can't analyze "g++ -m32 -march=i386" - "Provided compiler is not compatible")
    - name: 'CMake Configure'
      shell: bash
      run: |
        cmake --preset="config-linux-clang++-i386-debug"
        cmake --preset="config-linux-clang++-x86_64-debug"

    # Merge compile commands of both architectures
    - name: 'Merge Compile Commands'
      shell: bash
      run: |
        jq -s 'add' \
          "${{ env.IGROS_KERNEL_DIR_BUILD }}/Debug/config-linux-clang++-i386-debug/compile_commands.json" \
          "${{ env.IGROS_KERNEL_DIR_BUILD }}/Debug/config-linux-clang++-x86_64-debug/compile_commands.json" \
          > "${{ env.IGROS_KERNEL_DIR_BUILD }}/compile_commands.json"
        jq 'length' "${{ env.IGROS_KERNEL_DIR_BUILD }}/compile_commands.json"

    # Unit tests with coverage (both architectures' code paths)
    - name: 'Unit Tests Coverage'
      shell: bash
      run: |
        for arch in i386 x86_64; do
          cmake -S tests -B "build/tests-${arch}" -G Ninja -DCMAKE_CXX_COMPILER=g++ -DIGROS_TEST_ARCH=${arch} -DIGROS_TESTS_COVERAGE=ON
          cmake --build "build/tests-${arch}" --parallel
          ctest --test-dir "build/tests-${arch}" --output-on-failure --no-tests=error
        done
        gcovr --root . --exclude 'tests/' --sonarqube build/coverage.xml --cobertura build/cobertura.xml build/tests-i386 build/tests-x86_64
        gcovr --root . --exclude 'tests/' build/tests-i386 build/tests-x86_64

    # Uploads need tokens: say why they are skipped
    - name: 'Missing Tokens'
      if: env.HAS_CODACY_TOKEN != 'true' || env.HAS_SONAR_TOKEN != 'true'
      run: |
        echo "::notice::No Codacy/SonarCloud token for this run (Dependabot or fork): uploads skipped, tests and coverage still checked"

    # Codacy coverage upload
    - name: 'Codacy Coverage'
      if: env.HAS_CODACY_TOKEN == 'true'
      # Third-party action gets CODACY_PROJECT_TOKEN: pinned to commit (v1.3.0)
      uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: build/cobertura.xml

    # SonarCloud analysis
    - name: 'SonarCloud Analysis'
      if: env.HAS_SONAR_TOKEN == 'true'
      # Third-party action gets SONAR_TOKEN: pinned to commit (v8.3.0)
      uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.cfamily.compile-commands=${{ env.IGROS_KERNEL_DIR_BUILD }}/compile_commands.json
          -Dproject.settings=sonar-project.properties
          -Dsonar.coverageReportPaths=build/coverage.xml
