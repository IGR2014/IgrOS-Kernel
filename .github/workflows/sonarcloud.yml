name: 'SonarCloud'

# Triggered on push to any branch, PR to master or manually
# (not workflow_run: it always uses workflow files and code of the default branch)
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ 'master' ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read

    # Environment variables
    env:
      IGROS_KERNEL_DIR_BUILD: "${{ github.workspace }}/build"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install dependencies (configure only: Sonar needs compile commands, not binaries)
    - name: 'Install Dependencies'
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends clang cmake jq lld ninja-build

    # Configure both architectures with Clang
    # (one analysis per project/branch: Sonar keeps only the last one, and it
    # can't analyze "g++ -m32 -march=i386" - "Provided compiler is not compatible")
    - name: 'CMake Configure'
      shell: bash
      run: |
        cmake --preset="config-linux-clang++-i386-debug"
        cmake --preset="config-linux-clang++-x86_64-debug"

    # Merge compile commands of both architectures
    - name: 'Merge Compile Commands'
      shell: bash
      run: |
        jq -s 'add' \
          "${{ env.IGROS_KERNEL_DIR_BUILD }}/Debug/config-linux-clang++-i386-debug/compile_commands.json" \
          "${{ env.IGROS_KERNEL_DIR_BUILD }}/Debug/config-linux-clang++-x86_64-debug/compile_commands.json" \
          > "${{ env.IGROS_KERNEL_DIR_BUILD }}/compile_commands.json"
        jq 'length' "${{ env.IGROS_KERNEL_DIR_BUILD }}/compile_commands.json"

    # SonarCloud analysis
    - name: 'SonarCloud Analysis'
      # Third-party action gets SONAR_TOKEN: pinned to commit (v8.3.0)
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.cfamily.compile-commands=${{ env.IGROS_KERNEL_DIR_BUILD }}/compile_commands.json
          -Dproject.settings=sonar-project.properties
