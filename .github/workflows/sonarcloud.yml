name: 'SonarCloud'

# Triggered on push to any branch, PR to master or manually
# (not workflow_run: it always uses workflow files and code of the default branch)
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ 'master' ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch: [ 'i386', 'x86_64' ]
        compiler: [ 'clang++', 'g++' ]

    # Environment variables
    env:
      IGROS_KERNEL_DIR_BUILD: "${{ github.workspace }}/build"
      IGROS_KERNEL_DIR_INSTALL: "${{ github.workspace }}/install"
      CCACHE_BASEDIR: "${{ github.workspace }}/.ccache"
      CCACHE_DIR: "${{ github.workspace }}/.ccache/ccache"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "200M"
      CLICOLOR_FORCE: "1"
      NINJA_STATUS: "[%p::%e\t%f/%t]\t"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

   # Install dependencies
    - name: 'Install Dependencies'
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends ccache cmake doxygen graphviz g++-multilib gcc-multilib grub-common grub-pc-bin mtools ninja-build xorriso

    # Install Clang (Ubuntu 24.04 packages, same toolchain as Docker image)
    - name: 'Install Clang'
      shell: bash
      run: |
        sudo apt install -y --no-install-recommends clang lld
        clang++ --version
        ld.lld --version


    # Restore Build Cache
    - name: 'Restore Build Cache'
      uses: actions/cache@v6
      with:
        path: ${{ env.IGROS_KERNEL_DIR_BUILD }}
        key: build-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: |
          build-${{ matrix.compiler }}-${{ matrix.arch }}-

    # Restore CCache Cache
    - name: 'Restore CCache Cache'
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_BASEDIR }}
        key: ccache-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.compiler }}-${{ matrix.arch }}-

    # Configure
    - name: 'CMake Configure'
      shell: bash
      run: |
        mkdir -p ${{ env.CCACHE_BASEDIR }}
        cmake --preset="config-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug"

    # Build
    - name: 'CMake Build'
      shell: bash
      run: |
        cmake --build --preset="build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug" --target all --parallel

    # Install
    - name: 'CMake Install'
      shell: bash
      run: |
        cmake --build --preset="build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug" --target install

    # SonarCloud Wrapper analysis
    - name: 'SonarCloud Analysis'
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.cfamily.compile-commands=${{ env.IGROS_KERNEL_DIR_BUILD }}/Debug/config-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug/compile_commands.json
          -Dproject.settings=sonar-project.properties
          -X

