# Name
name: 'Analysis'

# Every analysis tool over every toolchain (config/script/analysis.sh): master report deployed
# to GitHub Pages (Settings -> Pages -> Source: GitHub Actions), pull request report uploaded
# as workflow artifact (linked in the PR comment, expires on its own).
# CodeQL isn't run here: codeql.yml uploads it to code scanning.
on:
  push:
    branches: [ 'master' ]
    paths-ignore: &docs
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.devcontainer/**'
      - '*.code-workspace'
      - '*.kateproject'
  pull_request:
    branches: [ 'master' ]
    paths-ignore: *docs
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it
permissions:
  contents: read

# Project jobs
jobs:

  # Analyze, upload report, fail on broken build/boot
  Analysis:

    # Name
    name: 'Analysis report'
    # OS
    runs-on: ubuntu-26.04
    # Four builds, boot tests and host tests take a few minutes; a hang must not take hours
    timeout-minutes: 30
    # Pull request comment
    permissions:
      contents: read
      pull-requests: write
    # Pages artifact uploaded (Deploy job runs even if findings fail this job)
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}

    # Environment variables
    env:
      IGROS_ANALYSIS_CODEQL: "none"
      # Pages serve master only (github-pages environment allows the default branch)
      PAGES: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # Fork PR token is read-only: no PR comment, report is in job summary and artifact
      COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

    # Job steps
    steps:

    # Checkout (full history: kernel version is taken from git tags)
    - name: 'Checkout repository'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install dependencies (toolchain, ISO tools, QEMU, analyzers, coverage, Doxygen);
    # ClangTidy from apt.llvm.org (same version as analysis image in Dockerfile)
    - name: 'Install Dependencies'
      # Stalled apt mirror: phases time out and retry (ci-apt.sh) instead of hanging the job
      timeout-minutes: 15
      shell: bash
      env:
        LLVM_VERSION: 23
      run: |
        sudo bash config/script/llvm-apt.sh "${LLVM_VERSION}"
        bash config/script/ci-apt.sh \
          clang "clang-tidy-${LLVM_VERSION}" cmake cppcheck doxygen g++-multilib gcc-multilib gcovr graphviz \
          grub-common grub-pc-bin lld mtools ninja-build python3 qemu-system-x86 xorriso
        sudo ln -sf "/usr/bin/clang-tidy-${LLVM_VERSION}" /usr/local/bin/clang-tidy
        sudo ln -sf "/usr/bin/run-clang-tidy-${LLVM_VERSION}" /usr/local/bin/run-clang-tidy

    # All configs: strict warnings, UBSan boot test, compiler warnings, ClangTidy, Cppcheck,
    # host tests coverage (report is published first, failures are checked in last step)
    - name: 'Analysis'
      shell: bash
      run: |
        bash config/script/analysis.sh

    # Report site: page, its data file, the coverage report and documentation it links to
    # (not build directories)
    - name: 'Collect Report'
      if: success() || failure()
      shell: bash
      run: |
        [[ -f build/analysis/index.html ]] || exit 0
        mkdir -p site/tests/reports
        cp build/analysis/index.html build/analysis/index.data.js site/
        [[ -d build/analysis/tests/reports/coverage ]] && cp -r build/analysis/tests/reports/coverage site/tests/reports/
        [[ -d build/analysis/docs ]] && cp -r build/analysis/docs site/docs
        exit 0

    # Master: Pages artifact (Deploy job publishes it)
    - name: 'Upload Pages Report'
      id: pages
      if: (success() || failure()) && env.PAGES == 'true' && hashFiles('site/index.html') != ''
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

    # Other branches and pull requests: report as workflow artifact (download, open index.html)
    - name: 'Upload Report'
      id: artifact
      if: (success() || failure()) && env.PAGES != 'true' && hashFiles('site/index.html') != ''
      uses: actions/upload-artifact@v7
      with:
        name: analysis-report
        path: site
        retention-days: 14

    # Summary with report link: job summary, pull request comment (updated in place)
    - name: 'Report Summary'
      if: success() || failure()
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.number }}
        ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
      run: |
        [[ -f build/analysis/summary.md ]] || exit 0
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        {
          echo "<!-- igros-analysis -->"
          echo "### Kernel analysis"
          echo
          cat build/analysis/summary.md
          echo
          if [[ "${PAGES}" == "true" ]]; then
            echo "[Full report](https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/) (findings with source, coverage) for ${GITHUB_SHA::7}"
          elif [[ -n "${ARTIFACT_URL}" ]]; then
            echo "[Full report](${ARTIFACT_URL}) for ${GITHUB_SHA::7}: download, open \`index.html\` (findings with source, coverage)"
          fi
        } > build/analysis/comment.md
        cat build/analysis/comment.md >> "${GITHUB_STEP_SUMMARY}"
        if [[ -n "${PR}" && "${COMMENT}" == "true" ]]; then
          comment="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- igros-analysis -->")) | .id' | head -n 1)"
          if [[ -n "${comment}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" -F body=@build/analysis/comment.md > /dev/null
          else
            gh pr comment "${PR}" --body-file build/analysis/comment.md
          fi
        fi

    # A config that doesn't configure, build or boot, failing host tests or any finding
    # (the code is kept free of them: fix it, or suppress with a reason) fail the job
    - name: 'Check Analysis'
      shell: bash
      run: |
        failed="$(grep -HE '^(configure|build|install|boot|coverage) [1-9]' build/analysis/*/reports/steps.txt || true)"
        if [[ -n "${failed}" ]]; then
          echo "::error::Analysis steps failed:"
          echo "${failed}"
          exit 1
        fi
        read -r errors warnings info < <(python3 -c 'import json, sys; c = json.load(open(sys.argv[1])); print(c["error"], c["warning"], c["info"])' build/analysis/counts.json)
        if [[ "$((errors + warnings + info))" -ne 0 ]]; then
          echo "::error::Analysis findings: ${errors} errors, ${warnings} warnings, ${info} info (see report)"
          exit 1
        fi

  # Master report to GitHub Pages (also when findings failed the Analysis job: the page shows them)
  Deploy:

    # Name
    name: 'Deploy report'
    needs: Analysis
    if: ${{ !cancelled() && needs.Analysis.outputs.pages == 'true' }}
    # OS
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Pages deployment (OIDC token proves deployment comes from this workflow)
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, the newest wins
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Job steps
    steps:
    - name: 'Deploy Pages'
      id: deployment
      uses: actions/deploy-pages@v5
