# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: 'CodeQL'

# Triggered on push to any branch, PR to master or manually
# (not workflow_run: it always uses workflow files and code of the default branch)
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ 'master' ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch: [ 'i386', 'x86_64' ]
        compiler: [ 'clang++', 'g++' ]

    # Environment variables
    env:
      IGROS_KERNEL_DIR_BUILD: "${{ github.workspace }}/build"
      IGROS_KERNEL_DIR_INSTALL: "${{ github.workspace }}/install"
      # CodeQL must see every compiler invocation: no ccache, no restored build
      CCACHE_DISABLE: "1"
      CLICOLOR_FORCE: "1"
      NINJA_STATUS: "[%p::%e\t%f/%t]\t"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # CodeQL initialize
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual

   # Install dependencies
    - name: 'Install Dependencies'
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends ccache cmake doxygen graphviz g++-multilib gcc-multilib grub-common grub-pc-bin mtools ninja-build xorriso

    # Install Clang (Ubuntu 24.04 packages, same toolchain as Docker image)
    - name: 'Install Clang'
      shell: bash
      run: |
        sudo apt install -y --no-install-recommends clang lld
        clang++ --version
        ld.lld --version

    # Configure
    - name: 'CMake Configure'
      shell: bash
      run: |
        cmake --preset="config-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug"

    # Build
    - name: 'CMake Build'
      shell: bash
      run: |
        cmake --build --preset="build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug" --target all --parallel

    # Install
    - name: 'CMake Install'
      shell: bash
      run: |
        cmake --build --preset="build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug" --target install

    # CodeQL Analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        # Separate category per matrix job, otherwise analyses of one commit replace each other
        category: '/language:c-cpp/arch:${{ matrix.arch }}/compiler:${{ matrix.compiler }}'

