# Name
name: 'IgrOS-Kernel CI/CD'

# Triggered on push to any branch, PR to master or manually
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ 'master' ]
  workflow_dispatch:

# Project jobs
jobs:

  # Build Kernel
  BuildKernel:

    # Name
    name: 'Build with CMake'
    # OS
    runs-on: ubuntu-24.04

    # Environment variables
    env:
      IGROS_KERNEL_DIR_BUILD: "${{ github.workspace }}/build"
      IGROS_KERNEL_DIR_INSTALL: "${{ github.workspace }}/install"
      CCACHE_BASEDIR: "${{ github.workspace }}/.ccache/build-linux-${{ matrix.compiler }}-x86_64-debug"
      CCACHE_DIR: "${{ github.workspace }}/.ccache/build-linux-${{ matrix.compiler }}-x86_64-debug/cache"

    # Strategy with languages matrix
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arch: [ 'i386', 'x86_64' ]
        compiler: [ 'clang++', 'g++' ]

    # Job steps
    steps:

    # Checkout
    - name: 'Checkout repository'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install dependencies
    - name: 'Install Dependencies'
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends ccache cmake doxygen graphviz g++-multilib gcc-multilib grub-common grub-pc-bin mtools ninja-build qemu-system-x86 xorriso

    # Install Clang (Ubuntu 24.04 packages, same toolchain as Docker image)
    - name: 'Install Clang'
      shell: bash
      run: |
        sudo apt install -y --no-install-recommends clang lld
        clang++ --version
        ld.lld --version

    # Restore Build Cache
    - name: 'Restore Build Cache'
      uses: actions/cache@v6
      with:
        path: ${{ env.IGROS_KERNEL_DIR_BUILD }}
        key: build-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: |
          build-${{ matrix.compiler }}-${{ matrix.arch }}-

    # Restore CCache Cache
    - name: 'Restore CCache Cache'
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_BASEDIR }}
        key: ccache-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.compiler }}-${{ matrix.arch }}-

    # Configure
    - name: 'CMake Configure'
      shell: bash
      run: |
        mkdir -p ${{ env.CCACHE_BASEDIR }}
        cmake --preset="config-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug"

    # Build
    - name: 'CMake Build'
      shell: bash
      run: |
        cmake --build --preset="build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug" --target all --parallel

    # Install
    - name: 'CMake Install'
      shell: bash
      run: |
        cmake --build --preset="build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug" --target install

    # Boot kernel in QEMU (reaches end of kmain, handles keyboard IRQ)
    - name: 'QEMU Boot Test'
      shell: bash
      run: |
        bash tests/boot/qemu-boot.sh ${{ matrix.arch }} "${{ env.IGROS_KERNEL_DIR_INSTALL }}/Debug/config-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug/kernel.iso"

    # Kernel Artifacts (also for failed boot test investigation)
    - name: 'Kernel Artifacts'
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.compiler }}-${{ matrix.arch }}-kernel
        path: |
          ${{ env.IGROS_KERNEL_DIR_INSTALL }}/Debug/config-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug/iso/boot/kernel.bin
          ${{ env.IGROS_KERNEL_DIR_INSTALL }}/Debug/config-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug/kernel.iso
        retention-days: 7

    # CCache Statistics
    - name: 'CCache Statistics'
      shell: bash
      run: |
        ccache -sv


  # Host unit tests
  UnitTests:

    # Name
    name: 'Unit Tests'
    # OS
    runs-on: ubuntu-24.04

    # Strategy with languages matrix
    strategy:
      fail-fast: false
      matrix:
        arch: [ 'i386', 'x86_64' ]
        compiler: [ 'clang++', 'g++' ]

    # Job steps
    steps:

    # Checkout
    - name: 'Checkout repository'
      uses: actions/checkout@v7

    # Install dependencies (multilib for 32-bit i386 code paths)
    - name: 'Install Dependencies'
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends clang cmake g++-multilib ninja-build

    # Configure
    - name: 'CMake Configure'
      shell: bash
      run: |
        cmake -S tests -B build/tests -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DIGROS_TEST_ARCH=${{ matrix.arch }}

    # Build
    - name: 'CMake Build'
      shell: bash
      run: |
        cmake --build build/tests --parallel

    # Run
    - name: 'CTest'
      shell: bash
      run: |
        ctest --test-dir build/tests --output-on-failure --no-tests=error
