# Name
name: 'IgrOS-Kernel CI/CD'

# Triggered on push to any branch, PR to master or manually
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ 'master' ]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it
permissions:
  contents: read

# Project jobs
jobs:

  # Free artifact storage first: drop kernel artifacts of previous runs on this branch/PR
  Cleanup:

    # Name
    name: 'Delete old artifacts'
    # OS
    runs-on: ubuntu-26.04

    # Deleting artifacts
    permissions:
      actions: write

    # Job steps
    steps:

    - name: 'Delete artifacts of previous runs on this branch'
      # A cleanup problem must never block the build
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # PR -> source branch, push -> branch name
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
          --jq ".artifacts[]
                | select(.expired | not)
                | select(.workflow_run.head_branch == env.BRANCH)
                | select(.workflow_run.id != ${GITHUB_RUN_ID})
                | select(.name | test(\"^(clang|g)\\\\+\\\\+-(i386|x86_64)-kernel$\"))
                | \"\(.id) \(.name)\"" |
        while read -r id name; do
          echo "Deleting $name (id $id)"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
        done


  # Build Kernel
  BuildKernel:

    # Name
    name: 'Build with CMake'
    # Only after all unit tests passed (no runner minutes on broken commits)
    # and old artifacts are gone (room for the uploads)
    needs: [ Cleanup, UnitTests ]
    # OS
    runs-on: ubuntu-26.04
    # A hung build or boot test must not burn runner minutes for hours
    timeout-minutes: 30

    # Environment variables
    env:
      IGROS_KERNEL_DIR_BUILD: "${{ github.workspace }}/build"
      IGROS_KERNEL_DIR_INSTALL: "${{ github.workspace }}/install"
      CCACHE_BASEDIR: "${{ github.workspace }}/.ccache/build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug"
      CCACHE_DIR: "${{ github.workspace }}/.ccache/build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug/cache"
      # Keeps each cache entry (and the repo's 10 GB cache quota) under control
      CCACHE_MAXSIZE: "500M"
      PRESET: "linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug"

    # Strategy with languages matrix
    strategy:
      fail-fast: false
      matrix:
        arch: [ 'i386', 'x86_64' ]
        compiler: [ 'clang++', 'g++' ]

    # Job steps
    steps:

    # Checkout
    - name: 'Checkout repository'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install dependencies (toolchain included)
    - name: 'Install Dependencies'
      # Mirror stalls and dpkg lock (unattended upgrades) must fail fast and retry, not hang the job
      timeout-minutes: 10
      shell: bash
      run: |
        echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ccache clang cmake doxygen g++-multilib gcc-multilib graphviz grub-common grub-pc-bin \
          lld mtools ninja-build qemu-system-x86 xorriso
        clang++ --version
        ld.lld --version

    # Restore CCache Cache
    # (the build directory itself is not cached: a fresh checkout makes every source newer
    # than the cached objects, so Ninja rebuilds everything anyway - ccache is what saves time)
    - name: 'Restore CCache Cache'
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_BASEDIR }}
        key: ccache-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.compiler }}-${{ matrix.arch }}-

    # Configure
    - name: 'CMake Configure'
      shell: bash
      run: |
        mkdir -p "${CCACHE_BASEDIR}"
        # Statistics below then show this build only
        ccache -z
        cmake --preset="config-${PRESET}"

    # Build
    - name: 'CMake Build'
      shell: bash
      run: |
        cmake --build --preset="build-${PRESET}" --target all --parallel

    # Install
    - name: 'CMake Install'
      shell: bash
      run: |
        cmake --build --preset="build-${PRESET}" --target install

    # Boot kernel in QEMU (reaches end of kmain, handles keyboard IRQ)
    - name: 'QEMU Boot Test'
      shell: bash
      timeout-minutes: 5
      run: |
        bash tests/boot/qemu-boot.sh ${{ matrix.arch }} "${IGROS_KERNEL_DIR_INSTALL}/Debug/config-${PRESET}/kernel.iso"

    # Kernel Artifacts (also for failed boot test investigation; skipped on cancel)
    - name: 'Kernel Artifacts'
      if: success() || failure()
      # A full artifact quota must not fail CI
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.compiler }}-${{ matrix.arch }}-kernel
        path: |
          ${{ env.IGROS_KERNEL_DIR_INSTALL }}/Debug/config-${{ env.PRESET }}/iso/boot/kernel.bin
          ${{ env.IGROS_KERNEL_DIR_INSTALL }}/Debug/config-${{ env.PRESET }}/kernel.iso
        if-no-files-found: ignore
        retention-days: 3

    # CCache Statistics
    - name: 'CCache Statistics'
      if: always()
      shell: bash
      run: |
        ccache -sv


  # Host unit tests
  UnitTests:

    # Name
    name: 'Unit Tests'
    # OS
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    # Strategy with languages matrix
    strategy:
      fail-fast: false
      matrix:
        arch: [ 'i386', 'x86_64' ]
        compiler: [ 'clang++', 'g++' ]

    # Job steps
    steps:

    # Checkout
    - name: 'Checkout repository'
      uses: actions/checkout@v7

    # Install dependencies (multilib for 32-bit i386 code paths)
    - name: 'Install Dependencies'
      # Mirror stalls and dpkg lock (unattended upgrades) must fail fast and retry, not hang the job
      timeout-minutes: 10
      shell: bash
      run: |
        echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang cmake g++-multilib ninja-build

    # Configure
    - name: 'CMake Configure'
      shell: bash
      run: |
        cmake -S tests -B build/tests -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DIGROS_TEST_ARCH=${{ matrix.arch }}

    # Build
    - name: 'CMake Build'
      shell: bash
      run: |
        cmake --build build/tests --parallel

    # Run
    - name: 'CTest'
      shell: bash
      run: |
        ctest --test-dir build/tests --output-on-failure --no-tests=error
