# Name
name: 'IgrOS-Kernel CI/CD'

# Triggered on push to any branch, PR to master or manually
# (documentation-only changes don't need a kernel build)
on:
  push:
    branches: [ '**' ]
    paths-ignore: &docs
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - '.devcontainer/**'
      - '*.code-workspace'
      - '*.kateproject'
  pull_request:
    branches: [ 'master' ]
    paths-ignore: *docs
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more ask for it
permissions:
  contents: read

# Project jobs
jobs:

  # Free artifact storage first: drop kernel artifacts of previous runs on this branch/PR
  Cleanup:

    # Name
    name: 'Delete old artifacts'
    # PR from a branch of this repository: same commit was already built by its push run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # OS
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    # Deleting artifacts
    permissions:
      actions: write

    # Job steps
    steps:

    - name: 'Delete artifacts of previous runs on this branch'
      # A cleanup problem must never block the build
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # PR -> source branch, push -> branch name
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
          --jq ".artifacts[]
                | select(.expired | not)
                | select(.workflow_run.head_branch == env.BRANCH)
                | select(.workflow_run.id != ${GITHUB_RUN_ID})
                | select(.name | test(\"^(clang|g)\\\\+\\\\+-(i386|x86_64)-kernel$\"))
                | \"\(.id) \(.name)\"" |
        while read -r id name; do
          echo "Deleting $name (id $id)"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
        done


  # Unit tests, kernel build and QEMU boot test in one job per toolchain:
  # packages are installed once and nothing waits for a separate test job
  BuildKernel:

    # Name
    name: 'Build & Test'
    # Old artifacts are gone first (room for the uploads)
    needs: [ Cleanup ]
    # OS
    runs-on: ubuntu-26.04
    # A hung build or boot test must not burn runner minutes for hours
    timeout-minutes: 30

    # Environment variables
    env:
      IGROS_KERNEL_DIR_BUILD: "${{ github.workspace }}/build"
      IGROS_KERNEL_DIR_INSTALL: "${{ github.workspace }}/install"
      # Same ccache directory and settings the build preset uses (its environment overrides
      # these during the kernel build), so unit tests and kernel share one cache and statistics
      CCACHE_BASEDIR: "${{ github.workspace }}"
      CCACHE_CONFIGPATH: "${{ github.workspace }}/.ccache/build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug"
      CCACHE_DIR: "${{ github.workspace }}/.ccache/build-linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug/cache"
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "200M"
      PRESET: "linux-${{ matrix.compiler }}-${{ matrix.arch }}-debug"

    # Strategy with languages matrix
    strategy:
      fail-fast: false
      matrix:
        arch: [ 'i386', 'x86_64' ]
        compiler: [ 'clang++', 'g++' ]

    # Job steps
    steps:

    # Checkout (full history: kernel version is taken from git tags)
    - name: 'Checkout repository'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install dependencies (toolchain, ISO tools, QEMU, BOCHS; no Doxygen: docs aren't part of "all")
    - name: 'Install Dependencies'
      # Stalled apt mirror: phases time out and retry (ci-apt.sh) instead of hanging the job
      timeout-minutes: 15
      shell: bash
      run: |
        bash config/script/ci-apt.sh \
          ccache clang cmake g++-multilib gcc-multilib grub-common grub-pc-bin \
          lld mtools ninja-build qemu-system-x86 xorriso           bochs bochs-x bochsbios vgabios xauth xvfb
        clang++ --version
        ld.lld --version

    # Restore CCache Cache (kernel and unit tests share it)
    # (the build directory itself is not cached: a fresh checkout makes every source newer
    # than the cached objects, so Ninja rebuilds everything anyway - ccache is what saves time)
    - name: 'Restore CCache Cache'
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ matrix.compiler }}-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.compiler }}-${{ matrix.arch }}-

    # Host unit tests first: a broken commit fails fast, before the kernel build
    - name: 'Unit Tests'
      shell: bash
      run: |
        mkdir -p "${CCACHE_DIR}"
        # Statistics below then show this job only
        ccache -z
        cmake -S tests -B build/tests -G Ninja \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DIGROS_TEST_ARCH=${{ matrix.arch }}
        cmake --build build/tests --parallel
        ctest --test-dir build/tests --output-on-failure --no-tests=error --parallel

    # Configure
    - name: 'CMake Configure'
      shell: bash
      run: |
        cmake --preset="config-${PRESET}"

    # Build
    - name: 'CMake Build'
      shell: bash
      run: |
        cmake --build --preset="build-${PRESET}" --target all --parallel

    # Install
    - name: 'CMake Install'
      shell: bash
      run: |
        cmake --build --preset="build-${PRESET}" --target install

    # Boot kernel in QEMU (reaches end of kmain, handles keyboard IRQ)
    - name: 'QEMU Boot Test'
      shell: bash
      timeout-minutes: 5
      run: |
        bash tests/boot/qemu-boot.sh ${{ matrix.arch }} "${IGROS_KERNEL_DIR_INSTALL}/Debug/config-${PRESET}/kernel.iso"

    # Boot kernel in BOCHS (headless; real UART character timing, unlike QEMU)
    - name: 'BOCHS Boot Test'
      shell: bash
      timeout-minutes: 5
      run: |
        bash tests/boot/bochs-boot.sh ${{ matrix.arch }} "${IGROS_KERNEL_DIR_INSTALL}/Debug/config-${PRESET}/kernel.iso"

    # Kernel Artifacts (also for failed boot test investigation; skipped on cancel)
    - name: 'Kernel Artifacts'
      if: success() || failure()
      # A full artifact quota must not fail CI
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.compiler }}-${{ matrix.arch }}-kernel
        path: |
          ${{ env.IGROS_KERNEL_DIR_INSTALL }}/Debug/config-${{ env.PRESET }}/iso/boot/kernel.bin
          ${{ env.IGROS_KERNEL_DIR_INSTALL }}/Debug/config-${{ env.PRESET }}/kernel.iso
        if-no-files-found: ignore
        retention-days: 3

    # CCache Statistics
    - name: 'CCache Statistics'
      if: always()
      shell: bash
      run: |
        ccache -sv
