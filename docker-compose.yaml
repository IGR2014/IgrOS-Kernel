x-kernel-build: &kernel-build
  build:
    context: .
    dockerfile: Dockerfile
  image: igros/kernel-toolchain:latest
  # Run as host user, so build/install/.ccache aren't owned by root
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - .:/home/igros/kernel
  environment:
    - TZ=Europe/Kyiv

# command: [<arch>, <compiler>, <debug|release>]
services:
  kernel_i386_clang_build:
    <<: *kernel-build
    command: ["i386", "clang++", "debug"]

  kernel_x86_64_clang_build:
    <<: *kernel-build
    command: ["x86_64", "clang++", "debug"]

  kernel_i386_gcc_build:
    <<: *kernel-build
    command: ["i386", "g++", "debug"]

  kernel_x86_64_gcc_build:
    <<: *kernel-build
    command: ["x86_64", "g++", "debug"]
