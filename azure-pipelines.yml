# Name
name: 'IgrOS-Kernel CI/CD'

# Triggered on push
trigger:
- '*'

# Project jobs
jobs:

  # Build Linux
  - job: Build_Linux

     # Name
    displayName: 'Build with CMake under Linux'

    # OS
    pool:
      vmImage: 'ubuntu-24.04'

    # Compiler
    strategy:
      maxParallel: "4"
      matrix:
        clang++-i386:
          compiler: clang++
          arch: i386
        clang++-x86_64:
          compiler: clang++
          arch: x86_64
        g++-i386:
          compiler: g++
          arch: i386
        g++-x86_64:
          compiler: g++
          arch: x86_64

    # Job variables
    variables:
    - name: IGROS_DIR_BUILD
      value: "$(Build.SourcesDirectory)/build"
      readonly: "true"
    - name: IGROS_DIR_INSTALL
      value: "$(Build.SourcesDirectory)/install"
      readonly: "true"
    - name: CCACHE_BASEDIR
      value: "$(Build.SourcesDirectory)/.ccache/build-linux-$(compiler)-x86_64-debug"
    - name: CCACHE_DIR
      value: "$(Build.SourcesDirectory)/.ccache/build-linux-$(compiler)-x86_64-debug/cache"
    - name: DEBIAN_FRONTEND
      value: "noninteractive"

    # Job steps
    steps:

      # Checkout
      - checkout: self
        fetchDepth: "0"
        displayName: 'Git Checkout'

      # Install dependencies
      - task: CmdLine@2
        inputs:
          script: |
            sudo apt-get update
            sudo apt install -y --no-install-recommends ccache cmake doxygen graphviz g++-multilib gcc-multilib grub-common grub-pc-bin mtools ninja-build xorriso
        displayName: 'Install Dependencies'

      # Install Clang (Ubuntu 24.04 packages, same toolchain as Docker image)
      - task: CmdLine@2
        inputs:
          script: |
            sudo apt install -y --no-install-recommends clang lld
            clang++ --version
            ld.lld --version
        displayName: 'Install Clang'

      # Restore Build Cache
      - task: Cache@2
        inputs:
          key: '"build" | "$(compiler)" | "$(arch)" | $(Build.SourceVersion)'
          restoreKeys: |
            "build" | "$(compiler)" | "$(arch)"
          path: $(IGROS_DIR_BUILD)
        displayName: 'Restore Build Cache'

      # Restore CCache Cache
      - task: Cache@2
        inputs:
          key: '"ccache" | "$(compiler)" | "$(arch)" | $(Build.SourceVersion)'
          restoreKeys: |
            "ccache" | "$(compiler)" | "$(arch)"
          path: $(CCACHE_BASEDIR)
        displayName: 'Restore CCache Cache'

      # Restore Install Cache
      - task: Cache@2
        inputs:
          key: '"install" | "$(compiler)" | "$(arch)" | $(Build.SourceVersion)'
          restoreKeys: |
            "install" | "$(compiler)" | "$(arch)"
          path: $(IGROS_DIR_INSTALL)
        displayName: 'Restore Install Cache'

      # CMake Configuration
      - task: CmdLine@2
        inputs:
          script: |
            mkdir -p $(CCACHE_DIR)
            cmake --preset="config-linux-$(compiler)-$(arch)-debug"
        displayName: 'CMake Configuration'

      # CMake Build
      - task: CmdLine@2
        inputs:
          script: |
            cmake --build --preset="build-linux-$(compiler)-$(arch)-debug" --target all --parallel
        displayName: 'CMake Build'

      # CMake Install
      - task: CmdLine@2
        inputs:
          script: |
            cmake --build --preset="build-linux-$(compiler)-$(arch)-debug" --target install
        displayName: 'CMake Install'

      # CCache Statistics
      - task: CmdLine@2
        inputs:
          script: |
            ccache -sv
        displayName: 'CCache Statistics'

